[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-factors"
version = "0.3.0"
description = "Shared factor computation library for PureSaber quant research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@v0.8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.9.0"]

[tool.quant-workspace]
layer = "strategy"
schemas = [{ id = "standard/v2", version = "2.0.0" }]
lock-files = ["requirements.lock"]

[project.scripts]
quant-factors = "quant_factors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=quant_factors", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.ruff]
line-length = 100
target-version = "py310"
