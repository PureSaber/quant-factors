name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: M8 contract tests
        run: pytest -q tests/test_contracts_v2.py --no-cov

      - name: QDK factory integration tests
        run: pytest -q tests/test_factor_frame.py -k "real_qdk" --no-cov

      - name: Unit and integration tests
        run: pytest -q

      - name: M8 pure branch coverage gates
        run: |
          coverage report --include=src/quant_factors/contracts_v2.py --fail-under=90
          coverage report --include=src/quant_factors/engine_v2.py --fail-under=90
          coverage report --include=src/quant_factors/factor_frame.py --fail-under=90
          coverage report --include=src/quant_factors/pit_v2.py --fail-under=90
