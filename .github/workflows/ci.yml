name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: M8 contract tests
        run: pytest -q tests/test_contracts_v2.py --no-cov

      - name: QDK factory integration tests
        run: pytest -q tests/test_factor_frame.py -k "real_qdk" --no-cov

      - name: Unit and integration tests
        run: pytest -q

      - name: M8 pure branch coverage gates
        run: |
          coverage report --include=src/quant_factors/contracts_v2.py --fail-under=90
          coverage report --include=src/quant_factors/engine_v2.py --fail-under=90
          coverage report --include=src/quant_factors/factor_frame.py --fail-under=90
          coverage report --include=src/quant_factors/pit_v2.py --fail-under=90
